<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--oc-bg);
        color: var(--oc-fg);
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #root {
        padding: 8px 10px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .group-title {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--oc-subtle);
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .row-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .row-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-value {
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: var(--oc-muted-surface);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 2px;
        background: var(--oc-primary);
      }
      .bar-fill.warn {
        background: var(--oc-warning-text);
      }
      .bar-fill.critical {
        background: var(--oc-error-text);
      }
      .note {
        color: var(--oc-subtle);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
