<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--oc-bg);
        color: var(--oc-fg);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #root {
        padding: 12px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        flex: 1;
      }
      .card {
        border: 1px solid var(--oc-border);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--oc-elevated);
      }
      .card-title {
        font-size: 12px;
        font-weight: 600;
        margin: 0 0 8px;
        color: var(--oc-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .card-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .window {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .window-label {
        font-weight: 500;
      }
      .window-value {
        color: var(--oc-muted);
        font-variant-numeric: tabular-nums;
      }
      .window-reset {
        color: var(--oc-subtle);
        font-size: 11px;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--oc-muted-surface);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 3px;
        background: var(--oc-primary);
      }
      .bar-fill.warn {
        background: var(--oc-warning-text);
      }
      .bar-fill.critical {
        background: var(--oc-error-text);
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        border: 1px solid var(--oc-border);
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 11px;
        color: var(--oc-muted);
      }
      .chip.warn {
        color: var(--oc-warning-text);
        border-color: var(--oc-warning-text);
      }
      .raw {
        margin: 0;
        padding: 8px;
        border-radius: 6px;
        background: var(--oc-bg);
        border: 1px solid var(--oc-border);
        font-size: 11px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .note {
        color: var(--oc-subtle);
        font-size: 11px;
      }
      .settings {
        border: 1px solid var(--oc-border);
        border-radius: 8px;
        padding: 8px 12px;
      }
      .settings-summary {
        cursor: pointer;
        font-weight: 500;
      }
      .settings-body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .save-status {
        flex: 1;
        color: var(--oc-muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
